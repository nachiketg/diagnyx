      # ── DX-036: diagnyx query ────────────────────────────────────────────────
      # One shared set of assertions runs against every queryable sink, so the
      # filter semantics can't quietly drift between the file and SQL paths.

      - name: DX-036 - write the query check library
        run: |
          mkdir -p /tmp/dx036
          cat > /tmp/dx036/lib.sh <<'LIB'
          DX="${DX:-./publish/diagnyx}"

          fail() { echo "FAIL [$SINK]: $*"; exit 1; }

          # expect <count> <query args...>: number of entries the query returns.
          # The query runs on its own line so a failing query fails the step instead of
          # looking like "0 results".
          expect() {
            local want="$1"; shift
            local out got
            out=$("$DX" query "$@")
            got=$(printf '%s' "$out" | jq -s 'length')
            [ "$got" = "$want" ] || fail "query $* returned $got entries, expected $want"
          }

          # first_message <query args...>: message of the first (oldest) returned entry.
          first_message() {
            local out
            out=$("$DX" query "$@")
            printf '%s' "$out" | jq -rs '.[0].message'
          }

          # run_query_checks <sink-name> <config-file>
          run_query_checks() {
            SINK="$1"
            export DIAGNYX_CONFIG="$2"

            "$DX" log --level info  --message "alpha startup complete" --source dx036-a
            "$DX" log --level error --message "beta payment failed"    --source dx036-a --context '{"orderId":"ord-42"}'
            "$DX" log --level warn  --message "gamma cache miss"       --source dx036-b
            "$DX" log --level error --message "delta timeout"          --source dx036-b
            "$DX" log --level info  --message "disk 100% full [ok]"    --source dx036-c

            # Exact filters.
            expect 2 --source dx036-a
            expect 1 --source dx036-a --level error
            expect 0 --source dx036-a --level fatal

            # Case-insensitive source and contains; contains also searches context.
            expect 1 --source DX036-A --contains PAYMENT
            expect 1 --source dx036-a --contains ord-42
            expect 0 --source dx036-a --contains no-such-text

            # Time range: relative and absolute, inclusive bounds.
            expect 2 --source dx036-b --since 1h
            expect 2 --source dx036-b --since 1d --until 2099-01-01T00:00:00Z
            expect 0 --source dx036-b --since 2099-01-01
            expect 0 --source dx036-b --until 2000-01-01

            # Bounds are inclusive: a timestamp taken from an entry includes that entry.
            local newest
            newest=$("$DX" query --source dx036-b --limit 1 | jq -r '.timestamp')
            expect 1 --source dx036-b --since "$newest"
            expect 2 --source dx036-b --until "$newest"

            # Order is oldest-first; --limit keeps the most recent matches.
            [ "$(first_message --source dx036-a)" = "alpha startup complete" ] || fail "results are not oldest-first"
            expect 1 --source dx036-a --limit 1
            [ "$(first_message --source dx036-a --limit 1)" = "beta payment failed" ] || fail "--limit did not keep the most recent entry"

            # LIKE wildcards in the search text must be literal (%, _ and, on SQL Server, [).
            expect 1 --source dx036-c --contains '100%'
            expect 0 --source dx036-c --contains '1%f'
            expect 0 --source dx036-c --contains 'd_sk'
            expect 1 --source dx036-c --contains '[ok]'
            expect 0 --source dx036-c --contains '[o]'

            # Output is the canonical schema, whichever sink it came from.
            "$DX" query --source dx036-a --level error \
              | jq -e '.context.orderId == "ord-42" and .source == "dx036-a" and .level == "error" and has("traceId") and has("spanId") and (.timestamp | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T.*Z$"))' > /dev/null \
              || fail "output is not a canonical schema entry"

            echo "OK [$SINK]: query checks passed"
          }

          # expect_error <stderr-pattern> <query args...>: the query must fail with a matching message.
          expect_error() {
            local pattern="$1"; shift
            local err
            if err=$("$DX" query "$@" 2>&1 >/dev/null); then
              fail "query $* should have failed"
            fi
            printf '%s' "$err" | grep -qi -- "$pattern" || fail "query $* failed with an unexpected message: $err"
          }

          # run_query_input_checks <config-with-dx036-b-entries>: input parsing and error reporting.
          run_query_input_checks() {
            SINK="input"
            export DIAGNYX_CONFIG="$1"

            # Every supported time format is accepted (all are earlier than the entries).
            for t in 30s 5m 2h 7d 2w 2026-01-01 2026-01-01T00:00Z 2026-01-01T00:00:00Z \
                     2026-01-01T00:00:00 2026-01-01T00:00:00.123Z 2026-01-01T00:00:00+02:00; do
              expect 2 --source dx036-b --since "$t"
            done

            expect_error "invalid --since"        --since bogus
            expect_error "invalid --since"        --since 0m
            expect_error "invalid --since"        --since -5m
            expect_error "invalid --since"        --since 99999999d
            expect_error "invalid --since"        --since 01/02/2026
            expect_error "invalid --until"        --until bogus
            expect_error "not be later than"      --since 2099-01-01 --until 2000-01-01
            expect_error "Invalid level"          --level nope
            expect_error "unknown option"         --bogus x
            expect_error "positive integer"       --limit 0
            expect_error "positive integer"       --limit abc
            expect_error "requires a non-empty"   --since
            expect_error "requires a non-empty"   --contains ""

            # Export-only sinks can't be read back.
            printf '{"sink":{"type":"otlp","otlp":{"endpoint":"http://127.0.0.1:9"}}}' > /tmp/dx036/otlp.json
            DIAGNYX_CONFIG=/tmp/dx036/otlp.json expect_error "write-only"
            printf '{"sink":{"type":"loki","loki":{"endpoint":"http://127.0.0.1:9"}}}' > /tmp/dx036/loki.json
            DIAGNYX_CONFIG=/tmp/dx036/loki.json expect_error "write-only"

            # A store that has never been written to is an empty result, not an error.
            printf '{"sink":{"type":"file","file":{"path":"/tmp/dx036/never-written.log"}}}' > /tmp/dx036/empty-file.json
            printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx036/never-written.db"}}}' > /tmp/dx036/empty-sqlite.json
            rm -f /tmp/dx036/never-written.log /tmp/dx036/never-written.db
            DIAGNYX_CONFIG=/tmp/dx036/empty-file.json   expect 0
            DIAGNYX_CONFIG=/tmp/dx036/empty-sqlite.json expect 0

            echo "OK: query input and error checks passed"
          }
          LIB

      - name: DX-036 - query returns matching entries from the file sink
        run: |
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx036/file.log"}}}' > /tmp/dx036/file.json
          source /tmp/dx036/lib.sh
          run_query_checks file /tmp/dx036/file.json

      - name: DX-036 - query returns matching entries from the SQLite sink
        run: |
          printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx036/sqlite.db"}}}' > /tmp/dx036/sqlite.json
          source /tmp/dx036/lib.sh
          run_query_checks sqlite /tmp/dx036/sqlite.json

      - name: DX-036 - query returns matching entries from the PostgreSQL sink
        run: |
          printf '{"sink":{"type":"postgres","postgres":{"connectionString":"Host=localhost;Port=5432;Database=diagnyx_test;Username=postgres;Password=postgres"}}}' > /tmp/dx036/postgres.json
          source /tmp/dx036/lib.sh
          run_query_checks postgres /tmp/dx036/postgres.json

      - name: DX-036 - query returns matching entries from the MySQL sink
        run: |
          printf '{"sink":{"type":"mysql","mysql":{"connectionString":"Server=127.0.0.1;Port=3306;Database=diagnyx_test;Uid=root;Pwd=mysql;"}}}' > /tmp/dx036/mysql.json
          source /tmp/dx036/lib.sh
          run_query_checks mysql /tmp/dx036/mysql.json

      - name: DX-036 - query returns matching entries from the SQL Server sink
        run: |
          printf '{"sink":{"type":"mssql","mssql":{"connectionString":"Server=localhost,1433;Database=diagnyx_test;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"}}}' > /tmp/dx036/mssql.json
          source /tmp/dx036/lib.sh
          run_query_checks mssql /tmp/dx036/mssql.json

      - name: DX-036 - query validates its input and reports errors clearly
        run: |
          source /tmp/dx036/lib.sh
          run_query_input_checks /tmp/dx036/file.json

      # ── DX-037: file sink retention/rotation ─────────────────────────────────

      - name: DX-037 - no rotation config leaves the file sink unchanged
        run: |
          mkdir -p /tmp/dx037
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx037/plain.log"}}}' > /tmp/dx037/plain.json
          DIAGNYX_CONFIG=/tmp/dx037/plain.json ./publish/diagnyx log --level info --message "a"
          DIAGNYX_CONFIG=/tmp/dx037/plain.json ./publish/diagnyx log --level info --message "b"
          test "$(wc -l < /tmp/dx037/plain.log)" -eq 2
          test ! -f /tmp/dx037/plain.log.1

      - name: DX-037 - size-based rotation caps backups at maxBackups
        run: |
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx037/size.log","maxSizeBytes":150,"maxBackups":2}}}' \
            > /tmp/dx037/size.json
          for i in 1 2 3 4 5 6; do
            DIAGNYX_CONFIG=/tmp/dx037/size.json ./publish/diagnyx log \
              --level info --message "entry number $i padding padding padding"
          done
          test -f /tmp/dx037/size.log
          test -f /tmp/dx037/size.log.1
          test -f /tmp/dx037/size.log.2
          test ! -f /tmp/dx037/size.log.3
          grep -q '"entry number 6' /tmp/dx037/size.log
          grep -q '"entry number 5' /tmp/dx037/size.log.1
          grep -q '"entry number 4' /tmp/dx037/size.log.2

      - name: DX-037 - age-based rotation
        run: |
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx037/age.log","maxAge":"1s","maxBackups":3}}}' \
            > /tmp/dx037/age.json
          DIAGNYX_CONFIG=/tmp/dx037/age.json ./publish/diagnyx log --level info --message "before"
          sleep 2
          DIAGNYX_CONFIG=/tmp/dx037/age.json ./publish/diagnyx log --level info --message "after"
          test -f /tmp/dx037/age.log.1
          grep -q "before" /tmp/dx037/age.log.1
          grep -q "after" /tmp/dx037/age.log
          ! grep -q "before" /tmp/dx037/age.log

      - name: DX-037 - maxBackups 0 rotates without keeping any backup
        run: |
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx037/zero.log","maxSizeBytes":10,"maxBackups":0}}}' \
            > /tmp/dx037/zero.json
          DIAGNYX_CONFIG=/tmp/dx037/zero.json ./publish/diagnyx log --level info --message "one"
          DIAGNYX_CONFIG=/tmp/dx037/zero.json ./publish/diagnyx log --level info --message "two"
          test ! -f /tmp/dx037/zero.log.1
          grep -q "two" /tmp/dx037/zero.log
          ! grep -q '"one"' /tmp/dx037/zero.log

      - name: DX-037 - lowering maxBackups prunes pre-existing excess backups
        run: |
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx037/shrink.log","maxSizeBytes":1,"maxBackups":5}}}' \
            > /tmp/dx037/shrink.json
          for i in 1 2 3 4 5; do
            DIAGNYX_CONFIG=/tmp/dx037/shrink.json ./publish/diagnyx log --level info --message "e$i"
          done
          test -f /tmp/dx037/shrink.log.4
          sed -i.bak 's/"maxBackups":5/"maxBackups":2/' /tmp/dx037/shrink.json
          DIAGNYX_CONFIG=/tmp/dx037/shrink.json ./publish/diagnyx log --level info --message "e6"
          test -f /tmp/dx037/shrink.log.1
          test -f /tmp/dx037/shrink.log.2
          test ! -f /tmp/dx037/shrink.log.3
          test ! -f /tmp/dx037/shrink.log.4

      - name: DX-037 - invalid rotation config is a clear error
        run: |
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx037/bad.log","maxAge":"nope"}}}' \
            > /tmp/dx037/badage.json
          DIAGNYX_CONFIG=/tmp/dx037/badage.json ./publish/diagnyx log \
            --level info --message "x" 2>/tmp/dx037/badage_err.txt && exit 1 || true
          grep -qi "sink.file.maxAge 'nope' is not a valid duration" /tmp/dx037/badage_err.txt

          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx037/bad.log","maxSizeBytes":0}}}' \
            > /tmp/dx037/badsize.json
          DIAGNYX_CONFIG=/tmp/dx037/badsize.json ./publish/diagnyx log \
            --level info --message "x" 2>/tmp/dx037/badsize_err.txt && exit 1 || true
          grep -qi "sink.file.maxSizeBytes must be a positive number" /tmp/dx037/badsize_err.txt

      - name: DX-037 - query only sees the active file, not rotated backups
        run: |
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx037/qtest.log","maxSizeBytes":10,"maxBackups":2}}}' \
            > /tmp/dx037/qtest.json
          DIAGNYX_CONFIG=/tmp/dx037/qtest.json ./publish/diagnyx log --level info --message "old one" --source dx037-q
          DIAGNYX_CONFIG=/tmp/dx037/qtest.json ./publish/diagnyx log --level info --message "new one" --source dx037-q
          test -f /tmp/dx037/qtest.log.1
          OUT=$(DIAGNYX_CONFIG=/tmp/dx037/qtest.json ./publish/diagnyx query --source dx037-q)
          echo "$OUT" | jq -es 'length == 1' > /dev/null
          echo "$OUT" | jq -e '.message == "new one"' > /dev/null

      # ── DX-038: retention policy for RDBMS sinks ─────────────────────────────
      # Same shared-library approach as DX-036: one set of assertions run
      # against every RDBMS engine, so a failure names the engine and the
      # behavior can't quietly drift between them.

      - name: DX-038 - write the retention check library
        run: |
          mkdir -p /tmp/dx038
          cat > /tmp/dx038/lib.sh <<'LIB'
          DX="${DX:-./publish/diagnyx}"

          fail() { echo "FAIL [$SINK]: $*"; exit 1; }

          # count <config-file> <source>: number of entries diagnyx query returns for that source.
          count() {
            DIAGNYX_CONFIG="$1" "$DX" query --source "$2" | jq -s 'length'
          }

          # run_retention_checks <sink-name> <plain-config> <clean-config> <never-config>
          #   plain: no maxAge at all.
          #   clean: maxAge=1s, retentionCheckProbability=1 (clean up on every write).
          #   never: maxAge=1s, retentionCheckProbability=0 (never clean up).
          run_retention_checks() {
            SINK="$1"; PLAIN="$2"; CLEAN="$3"; NEVER="$4"

            DIAGNYX_CONFIG="$PLAIN" "$DX" log --level info --message "plain old" --source dx038-plain
            sleep 1.5
            DIAGNYX_CONFIG="$PLAIN" "$DX" log --level info --message "plain new" --source dx038-plain
            [ "$(count "$PLAIN" dx038-plain)" = "2" ] || fail "no retention configured should keep both entries"

            DIAGNYX_CONFIG="$CLEAN" "$DX" log --level info --message "clean old" --source dx038-clean
            sleep 1.5
            DIAGNYX_CONFIG="$CLEAN" "$DX" log --level info --message "clean new" --source dx038-clean
            [ "$(count "$CLEAN" dx038-clean)" = "1" ] || fail "probability 1 should have deleted the old entry"
            DIAGNYX_CONFIG="$CLEAN" "$DX" query --source dx038-clean \
              | jq -e '.message == "clean new"' > /dev/null || fail "wrong entry survived cleanup"

            DIAGNYX_CONFIG="$NEVER" "$DX" log --level info --message "never old" --source dx038-never
            sleep 1.5
            DIAGNYX_CONFIG="$NEVER" "$DX" log --level info --message "never new" --source dx038-never
            [ "$(count "$NEVER" dx038-never)" = "2" ] || fail "probability 0 should never delete despite maxAge"

            echo "OK [$SINK]: retention checks passed"
          }

          # expect_error <stderr-pattern> <config-file>: a log call must fail with a matching message.
          expect_error() {
            local pattern="$1" cfg="$2"
            local err
            if err=$(DIAGNYX_CONFIG="$cfg" "$DX" log --level info --message "x" 2>&1 >/dev/null); then
              fail "log with $cfg should have failed"
            fi
            printf '%s' "$err" | grep -qi -- "$pattern" || fail "$cfg failed with an unexpected message: $err"
          }
          LIB

      - name: DX-038 - retention cleanup works on the SQLite sink
        run: |
          printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx038/sqlite-plain.db"}}}' \
            > /tmp/dx038/sqlite-plain.json
          printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx038/sqlite-clean.db","maxAge":"1s","retentionCheckProbability":1}}}' \
            > /tmp/dx038/sqlite-clean.json
          printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx038/sqlite-never.db","maxAge":"1s","retentionCheckProbability":0}}}' \
            > /tmp/dx038/sqlite-never.json
          source /tmp/dx038/lib.sh
          run_retention_checks sqlite /tmp/dx038/sqlite-plain.json /tmp/dx038/sqlite-clean.json /tmp/dx038/sqlite-never.json

      - name: DX-038 - retention cleanup works on the PostgreSQL sink
        run: |
          printf '{"sink":{"type":"postgres","postgres":{"connectionString":"Host=localhost;Port=5432;Database=diagnyx_test;Username=postgres;Password=postgres"}}}' \
            > /tmp/dx038/postgres-plain.json
          printf '{"sink":{"type":"postgres","postgres":{"connectionString":"Host=localhost;Port=5432;Database=diagnyx_test;Username=postgres;Password=postgres","maxAge":"1s","retentionCheckProbability":1}}}' \
            > /tmp/dx038/postgres-clean.json
          printf '{"sink":{"type":"postgres","postgres":{"connectionString":"Host=localhost;Port=5432;Database=diagnyx_test;Username=postgres;Password=postgres","maxAge":"1s","retentionCheckProbability":0}}}' \
            > /tmp/dx038/postgres-never.json
          source /tmp/dx038/lib.sh
          run_retention_checks postgres /tmp/dx038/postgres-plain.json /tmp/dx038/postgres-clean.json /tmp/dx038/postgres-never.json

      - name: DX-038 - retention cleanup works on the MySQL sink
        run: |
          printf '{"sink":{"type":"mysql","mysql":{"connectionString":"Server=127.0.0.1;Port=3306;Database=diagnyx_test;Uid=root;Pwd=mysql;"}}}' \
            > /tmp/dx038/mysql-plain.json
          printf '{"sink":{"type":"mysql","mysql":{"connectionString":"Server=127.0.0.1;Port=3306;Database=diagnyx_test;Uid=root;Pwd=mysql;","maxAge":"1s","retentionCheckProbability":1}}}' \
            > /tmp/dx038/mysql-clean.json
          printf '{"sink":{"type":"mysql","mysql":{"connectionString":"Server=127.0.0.1;Port=3306;Database=diagnyx_test;Uid=root;Pwd=mysql;","maxAge":"1s","retentionCheckProbability":0}}}' \
            > /tmp/dx038/mysql-never.json
          source /tmp/dx038/lib.sh
          run_retention_checks mysql /tmp/dx038/mysql-plain.json /tmp/dx038/mysql-clean.json /tmp/dx038/mysql-never.json

      - name: DX-038 - retention cleanup works on the SQL Server sink
        run: |
          printf '{"sink":{"type":"mssql","mssql":{"connectionString":"Server=localhost,1433;Database=diagnyx_test;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"}}}' \
            > /tmp/dx038/mssql-plain.json
          printf '{"sink":{"type":"mssql","mssql":{"connectionString":"Server=localhost,1433;Database=diagnyx_test;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True","maxAge":"1s","retentionCheckProbability":1}}}' \
            > /tmp/dx038/mssql-clean.json
          printf '{"sink":{"type":"mssql","mssql":{"connectionString":"Server=localhost,1433;Database=diagnyx_test;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True","maxAge":"1s","retentionCheckProbability":0}}}' \
            > /tmp/dx038/mssql-never.json
          source /tmp/dx038/lib.sh
          run_retention_checks mssql /tmp/dx038/mssql-plain.json /tmp/dx038/mssql-clean.json /tmp/dx038/mssql-never.json

      - name: DX-038 - invalid retention config is a clear error
        run: |
          source /tmp/dx038/lib.sh
          printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx038/badage.db","maxAge":"bogus"}}}' \
            > /tmp/dx038/badage.json
          expect_error "not a valid duration" /tmp/dx038/badage.json

          printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx038/badprob.db","maxAge":"1d","retentionCheckProbability":1.5}}}' \
            > /tmp/dx038/badprob.json
          expect_error "must be between 0 and 1" /tmp/dx038/badprob.json

          printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx038/negprob.db","maxAge":"1d","retentionCheckProbability":-0.1}}}' \
            > /tmp/dx038/negprob.json
          expect_error "must be between 0 and 1" /tmp/dx038/negprob.json
          echo "OK: retention input checks passed"

      # ── DX-039: v1 config files stay backward compatible ─────────────────────
      # Every config below is copied verbatim from the docs/CONFIG.md that
      # shipped in v0.1.0 (git show v0.1.0:docs/CONFIG.md), before any Phase 2
      # field existed -- the actual JSON a v1 user's config file would contain,
      # not a guess at what "old" looks like.

      - name: DX-039 - a config file that is just {} behaves like v1's zero-config default
        run: |
          rm -rf "$HOME/.diagnyx"
          printf '{}' > /tmp/dx039-empty.json
          DIAGNYX_CONFIG=/tmp/dx039-empty.json ./publish/diagnyx log \
            --level info --message "dx-039 empty config" --source dx039-v1compat
          test -f "$HOME/.diagnyx/logs/diagnyx.log"
          grep -q '"message":"dx-039 empty config"' "$HOME/.diagnyx/logs/diagnyx.log"
          test ! -f "$HOME/.diagnyx/logs/diagnyx.log.1"
          test ! -f "$HOME/.diagnyx/metrics.db"

      - name: 'DX-039 - v0.1.0 CONFIG.md example: Minimal (all defaults)'
        run: |
          rm -rf "$HOME/.diagnyx"
          printf '{"sink":{"type":"file"}}' > /tmp/dx039-minimal.json
          DIAGNYX_CONFIG=/tmp/dx039-minimal.json ./publish/diagnyx log \
            --level warn --message "dx-039 minimal" --source dx039-v1compat
          grep -q '"message":"dx-039 minimal"' "$HOME/.diagnyx/logs/diagnyx.log"

      - name: 'DX-039 - v0.1.0 CONFIG.md example: Custom file path'
        run: |
          mkdir -p /tmp/dx039
          cat > /tmp/dx039-customfile.json <<'JSON'
          {
            "sink": {
              "type": "file",
              "file": {
                "path": "/tmp/dx039/app.log"
              }
            },
            "defaults": {
              "source": "my-api"
            }
          }
          JSON
          DIAGNYX_CONFIG=/tmp/dx039-customfile.json ./publish/diagnyx log \
            --level info --message "dx-039 custom path"
          grep -q '"source":"my-api"' /tmp/dx039/app.log
          grep -q '"message":"dx-039 custom path"' /tmp/dx039/app.log
          test ! -f /tmp/dx039/app.log.1

      - name: 'DX-039 - v0.1.0 CONFIG.md example: SQLite'
        run: |
          cat > /tmp/dx039-sqlite.json <<'JSON'
          {
            "sink": {
              "type": "sqlite",
              "sqlite": {
                "path": "/tmp/dx039/diagnyx.db"
              }
            },
            "defaults": {
              "source": "my-api"
            }
          }
          JSON
          DIAGNYX_CONFIG=/tmp/dx039-sqlite.json ./publish/diagnyx log \
            --level error --message "dx-039 sqlite" --source dx039-v1compat \
            --context '{"orderId":"ord-1"}'
          COUNT=$(sqlite3 /tmp/dx039/diagnyx.db \
            "SELECT COUNT(*) FROM diagnyx_logs WHERE source='dx039-v1compat'")
          test "$COUNT" -eq 1
          test ! -f "$HOME/.diagnyx/metrics.db"

      - name: 'DX-039 - v0.1.0 CONFIG.md example: PostgreSQL'
        run: |
          cat > /tmp/dx039-postgres.json <<'JSON'
          {
            "sink": {
              "type": "postgres",
              "postgres": {
                "connectionString": "Host=localhost;Port=5432;Database=diagnyx_test;Username=postgres;Password=postgres"
              }
            }
          }
          JSON
          DIAGNYX_CONFIG=/tmp/dx039-postgres.json ./publish/diagnyx log \
            --level info --message "dx-039 postgres" --source dx039-v1compat
          COUNT=$(PGPASSWORD=postgres psql -h localhost -U postgres -d diagnyx_test \
            -t -c "SELECT COUNT(*) FROM diagnyx_logs WHERE source='dx039-v1compat';" | tr -d ' \n')
          test "$COUNT" -eq 1

      - name: 'DX-039 - v0.1.0 CONFIG.md example: MySQL'
        run: |
          cat > /tmp/dx039-mysql.json <<'JSON'
          {
            "sink": {
              "type": "mysql",
              "mysql": {
                "connectionString": "Server=127.0.0.1;Port=3306;Database=diagnyx_test;Uid=root;Pwd=mysql;"
              }
            }
          }
          JSON
          DIAGNYX_CONFIG=/tmp/dx039-mysql.json ./publish/diagnyx log \
            --level info --message "dx-039 mysql" --source dx039-v1compat
          COUNT=$(mysql -h 127.0.0.1 -P 3306 -u root -pmysql diagnyx_test -sN \
            -e "SELECT COUNT(*) FROM diagnyx_logs WHERE source='dx039-v1compat';")
          test "$COUNT" -eq 1

      - name: 'DX-039 - v0.1.0 CONFIG.md example: Microsoft SQL Server'
        run: |
          cat > /tmp/dx039-mssql.json <<'JSON'
          {
            "sink": {
              "type": "mssql",
              "mssql": {
                "connectionString": "Server=localhost,1433;Database=diagnyx_test;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
              }
            }
          }
          JSON
          DIAGNYX_CONFIG=/tmp/dx039-mssql.json ./publish/diagnyx log \
            --level info --message "dx-039 mssql" --source dx039-v1compat
          COUNT=$(sqlcmd -S localhost,1433 -U sa -P 'YourStrong!Passw0rd' -C \
            -d diagnyx_test \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM diagnyx_logs WHERE source='dx039-v1compat'" \
            -h -1 | tr -d ' \r\n')
          test "$COUNT" -eq 1
