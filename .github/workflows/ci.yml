          grep -q 'diagnyx_log_entries_total{level="info",source="svc-a"} 2' /tmp/dx035/metrics.txt
          grep -q 'diagnyx_log_entries_total{level="error",source="svc-a"} 1' /tmp/dx035/metrics.txt
          grep -q 'diagnyx_log_entries_total{level="warn",source="svc-b"} 1' /tmp/dx035/metrics.txt

