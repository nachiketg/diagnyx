          DIAGNYX_CONFIG=/tmp/dx035/config.json ./publish/diagnyx log --level info  --message "m2" --source svc-a
          DIAGNYX_CONFIG=/tmp/dx035/config.json ./publish/diagnyx log --level error --message "m3" --source svc-a
          DIAGNYX_CONFIG=/tmp/dx035/config.json ./publish/diagnyx log --level warn  --message "m4" --source svc-b
