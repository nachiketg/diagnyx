name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diagnyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: diagnyx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "YourStrong!Passw0rd"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15

      loki:
        image: grafana/loki:3.0.0
        ports:
          - 3100:3100
        options: >-
          --health-cmd "wget -q --spider http://localhost:3100/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      grafana:
        image: grafana/grafana:11.1.0
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: admin
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -q --spider http://localhost:3000/api/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (framework-dependent)
        run: dotnet publish core/Diagnyx.Core.csproj -c Release -o publish

      # ── Basic CLI ────────────────────────────────────────────────────────────

      - name: Smoke - help
        run: ./publish/diagnyx --help

      - name: Smoke - version
        run: ./publish/diagnyx --version

      # ── DX-004: log command ──────────────────────────────────────────────────

      - name: DX-004 - log writes a structured entry (info)
        run: ./publish/diagnyx log --level info --message "CI smoke test" --source ci

      - name: DX-004 - log writes a structured entry (with context)
        run: ./publish/diagnyx log --level warn --message "context test" --source ci --context '{"run":1}'

      # ── DX-005: validation ───────────────────────────────────────────────────

      - name: DX-005 - invalid level exits 1
        run: ./publish/diagnyx log --level NOPE --message "bad" && exit 1 || true

      - name: DX-005 - missing level exits 1
        run: ./publish/diagnyx log --message "no level" && exit 1 || true

      - name: DX-005 - missing message exits 1
        run: ./publish/diagnyx log --level info && exit 1 || true

      - name: DX-005 - malformed context JSON exits 1
        run: ./publish/diagnyx log --level info --message "bad ctx" --context 'not-json' && exit 1 || true

      - name: DX-005 - non-object context JSON exits 1
        run: ./publish/diagnyx log --level info --message "bad ctx" --context '[1,2,3]' && exit 1 || true

      # ── DX-007: init command ─────────────────────────────────────────────────

      - name: DX-007 - init creates config file
        run: |
          mkdir /tmp/initdir
          cd /tmp/initdir && $GITHUB_WORKSPACE/publish/diagnyx init
          test -f /tmp/initdir/diagnyx.config.json

      - name: DX-007 - init is no-op if config already exists
        run: cd /tmp/initdir && $GITHUB_WORKSPACE/publish/diagnyx init

      # ── DX-008: file sink default path ───────────────────────────────────────

      - name: DX-008 - zero-config writes valid NDJSON to default path
        run: |
          rm -rf "$HOME/.diagnyx"
          ./publish/diagnyx log --level info --message "dx-008 test" --source ci
          test -f "$HOME/.diagnyx/logs/diagnyx.log"
          grep -q '"timestamp"'            "$HOME/.diagnyx/logs/diagnyx.log"
          grep -q '"level":"info"'         "$HOME/.diagnyx/logs/diagnyx.log"
          grep -q '"message":"dx-008 test"' "$HOME/.diagnyx/logs/diagnyx.log"
          grep -q '"source":"ci"'          "$HOME/.diagnyx/logs/diagnyx.log"
          grep -q '"context":null'         "$HOME/.diagnyx/logs/diagnyx.log"
          grep -q '"traceId":null'         "$HOME/.diagnyx/logs/diagnyx.log"
          grep -q '"spanId":null'          "$HOME/.diagnyx/logs/diagnyx.log"

      - name: DX-008 - second log appends a new line (not overwrites)
        run: |
          ./publish/diagnyx log --level debug --message "dx-008 append test" --source ci
          test "$(wc -l < "$HOME/.diagnyx/logs/diagnyx.log")" -ge 2

      # ── DX-009: custom file path via config ──────────────────────────────────

      - name: DX-009 - custom sink.file.path is respected
        run: |
          mkdir -p /tmp/dx009
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx009/nested/deep/app.log"}}}' \
            > /tmp/dx009/diagnyx.config.json
          cd /tmp/dx009 && $GITHUB_WORKSPACE/publish/diagnyx log \
            --level debug --message "dx-009 custom-path test" --source ci
          test -f /tmp/dx009/nested/deep/app.log
          grep -q '"level":"debug"' /tmp/dx009/nested/deep/app.log

      - name: DX-009 - tilde path in config is expanded correctly
        run: |
          mkdir -p /tmp/dx009tilde
          printf '{"sink":{"type":"file","file":{"path":"~/.diagnyx/custom/tilde.log"}}}' \
            > /tmp/dx009tilde/diagnyx.config.json
          cd /tmp/dx009tilde && $GITHUB_WORKSPACE/publish/diagnyx log \
            --level info --message "tilde expansion test" --source ci
          test -f "$HOME/.diagnyx/custom/tilde.log"

      # ── DX-011: SQLite sink ──────────────────────────────────────────────────

      - name: DX-011 - SQLite sink writes rows and auto-creates table
        run: |
          mkdir -p /tmp/dx011
          printf '{"sink":{"type":"sqlite","sqlite":{"path":"/tmp/dx011/diagnyx.db"}}}' \
            > /tmp/dx011/diagnyx.config.json
          cd /tmp/dx011 && $GITHUB_WORKSPACE/publish/diagnyx log \
            --level info --message "sqlite test" --source ci
          test -f /tmp/dx011/diagnyx.db
          COUNT=$(sqlite3 /tmp/dx011/diagnyx.db 'SELECT COUNT(*) FROM diagnyx_logs')
          test "$COUNT" -eq 1

      - name: DX-011 - SQLite sink appends on subsequent writes
        run: |
          cd /tmp/dx011 && $GITHUB_WORKSPACE/publish/diagnyx log \
            --level warn --message "sqlite second entry" --source ci --context '{"k":"v"}'
          COUNT=$(sqlite3 /tmp/dx011/diagnyx.db 'SELECT COUNT(*) FROM diagnyx_logs')
          test "$COUNT" -eq 2

      - name: DX-011 - SQLite sink stores context as JSON text
        run: |
          CTX=$(sqlite3 /tmp/dx011/diagnyx.db "SELECT context FROM diagnyx_logs WHERE context IS NOT NULL LIMIT 1")
          test "$CTX" = '{"k":"v"}'

      # ── DX-012: PostgreSQL sink ──────────────────────────────────────────────

      - name: DX-012 - PostgreSQL sink writes rows and auto-creates table
        env:
          DIAGNYX_CONFIG: /tmp/dx012.json
        run: |
          printf '{"sink":{"type":"postgres","postgres":{"connectionString":"Host=localhost;Port=5432;Database=diagnyx_test;Username=postgres;Password=postgres"}}}' \
            > /tmp/dx012.json
          $GITHUB_WORKSPACE/publish/diagnyx log \
            --level info --message "postgres test" --source ci
          COUNT=$(PGPASSWORD=postgres psql -h localhost -U postgres -d diagnyx_test \
            -t -c "SELECT COUNT(*) FROM diagnyx_logs;" | tr -d ' \n')
          test "$COUNT" -eq 1

      - name: DX-012 - PostgreSQL sink appends on subsequent writes
        env:
          DIAGNYX_CONFIG: /tmp/dx012.json
        run: |
          $GITHUB_WORKSPACE/publish/diagnyx log \
            --level error --message "postgres second entry" --source ci --context '{"pg":true}'
          COUNT=$(PGPASSWORD=postgres psql -h localhost -U postgres -d diagnyx_test \
            -t -c "SELECT COUNT(*) FROM diagnyx_logs;" | tr -d ' \n')
          test "$COUNT" -eq 2

      - name: DX-012 - PostgreSQL sink stores all schema fields
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d diagnyx_test \
            -c "SELECT timestamp, level, message, source, context, trace_id, span_id FROM diagnyx_logs LIMIT 1;"

      # ── DX-013: MySQL sink ───────────────────────────────────────────────────

      - name: DX-013 - MySQL sink writes rows and auto-creates table
        env:
          DIAGNYX_CONFIG: /tmp/dx013.json
        run: |
          printf '{"sink":{"type":"mysql","mysql":{"connectionString":"Server=127.0.0.1;Port=3306;Database=diagnyx_test;Uid=root;Pwd=mysql;"}}}' \
            > /tmp/dx013.json
          $GITHUB_WORKSPACE/publish/diagnyx log \
            --level info --message "mysql test" --source ci
          COUNT=$(mysql -h 127.0.0.1 -P 3306 -u root -pmysql diagnyx_test -sN \
            -e "SELECT COUNT(*) FROM diagnyx_logs;")
          test "$COUNT" -eq 1

      - name: DX-013 - MySQL sink appends on subsequent writes
        env:
          DIAGNYX_CONFIG: /tmp/dx013.json
        run: |
          $GITHUB_WORKSPACE/publish/diagnyx log \
            --level warn --message "mysql second entry" --source ci --context '{"mysql":true}'
          COUNT=$(mysql -h 127.0.0.1 -P 3306 -u root -pmysql diagnyx_test -sN \
            -e "SELECT COUNT(*) FROM diagnyx_logs;")
          test "$COUNT" -eq 2

      - name: DX-013 - MySQL sink stores context as text
        run: |
          CTX=$(mysql -h 127.0.0.1 -P 3306 -u root -pmysql diagnyx_test -sN \
            -e "SELECT context FROM diagnyx_logs WHERE context IS NOT NULL LIMIT 1;")
          test "$CTX" = '{"mysql":true}'

      # ── DX-014: MSSQL sink ───────────────────────────────────────────────────

      - name: Install sqlcmd for MSSQL verification
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: DX-014 - create MSSQL test database
        run: |
          sqlcmd -S localhost,1433 -U sa -P 'YourStrong!Passw0rd' -C \
            -Q "IF DB_ID('diagnyx_test') IS NULL CREATE DATABASE diagnyx_test"

      - name: DX-014 - MSSQL sink writes rows and auto-creates table
        env:
          DIAGNYX_CONFIG: /tmp/dx014.json
        run: |
          printf '{"sink":{"type":"mssql","mssql":{"connectionString":"Server=localhost,1433;Database=diagnyx_test;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"}}}' \
            > /tmp/dx014.json
          $GITHUB_WORKSPACE/publish/diagnyx log \
            --level info --message "mssql test" --source ci
          COUNT=$(sqlcmd -S localhost,1433 -U sa -P 'YourStrong!Passw0rd' -C \
            -d diagnyx_test -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM diagnyx_logs" -h -1 | tr -d ' \r\n')
          test "$COUNT" -eq 1

      - name: DX-014 - MSSQL sink appends on subsequent writes
        env:
          DIAGNYX_CONFIG: /tmp/dx014.json
        run: |
          $GITHUB_WORKSPACE/publish/diagnyx log \
            --level error --message "mssql second entry" --source ci --context '{"mssql":true}'
          COUNT=$(sqlcmd -S localhost,1433 -U sa -P 'YourStrong!Passw0rd' -C \
            -d diagnyx_test -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM diagnyx_logs" -h -1 | tr -d ' \r\n')
          test "$COUNT" -eq 2

      - name: DX-014 - MSSQL sink stores context as text
        run: |
          CTX=$(sqlcmd -S localhost,1433 -U sa -P 'YourStrong!Passw0rd' -C \
            -d diagnyx_test \
            -Q "SET NOCOUNT ON; SELECT TOP 1 context FROM diagnyx_logs WHERE context IS NOT NULL" \
            -h -1 | tr -d ' \r\n')
          test "$CTX" = '{"mssql":true}'

      # ── DX-016: clear connection errors ─────────────────────────────────────

      - name: DX-016 - failed connection prints actionable error (postgres)
        run: |
          printf '{"sink":{"type":"postgres","postgres":{"connectionString":"Host=badhost;Port=5432;Database=x;Username=x;Password=x"}}}' \
            > /tmp/dx016.json
          DIAGNYX_CONFIG=/tmp/dx016.json $GITHUB_WORKSPACE/publish/diagnyx log \
            --level info --message "test" --source ci 2>/tmp/dx016_err.txt && exit 1 || true
          grep -qi "could not connect to postgresql" /tmp/dx016_err.txt

      - name: DX-016 - failed connection prints actionable error (mysql)
        run: |
          printf '{"sink":{"type":"mysql","mysql":{"connectionString":"Server=badhost;Port=3306;Database=x;Uid=x;Pwd=x;"}}}' \
            > /tmp/dx016m.json
          DIAGNYX_CONFIG=/tmp/dx016m.json $GITHUB_WORKSPACE/publish/diagnyx log \
            --level info --message "test" --source ci 2>/tmp/dx016m_err.txt && exit 1 || true
          grep -qi "could not connect to mysql" /tmp/dx016m_err.txt

      # ── DX-017/018/019: .NET SDK package ─────────────────────────────────────

      - name: DX-019 - .NET SDK builds without warnings
        run: dotnet build packages/dotnet/Diagnyx.Client.csproj -c Release

      - name: DX-019 - .NET SDK produces valid NuGet package
        run: |
          dotnet pack packages/dotnet/Diagnyx.Client.csproj -c Release -o /tmp/nupkg
          ls /tmp/nupkg/diagnyx-dotnet.*.nupkg

      - name: DX-019 - .NET SDK smoke test via CLI binary
        env:
          DIAGNYX_PATH: ./publish/diagnyx
          DIAGNYX_CONFIG: /tmp/dx019.json
        run: |
          mkdir -p /tmp/dx019
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx019/sdk.log"}}}' \
            > /tmp/dx019.json
          dotnet run --project packages/dotnet/tests/SmokeTest/SmokeTest.csproj
          test -f /tmp/dx019/sdk.log
          grep -q '"level":"info"'   /tmp/dx019/sdk.log
          grep -q '"source":"sdk-test"' /tmp/dx019/sdk.log

      - name: DX-028 - .NET SDK accepts explicit and ambient (Activity.Current) trace context
        env:
          DIAGNYX_PATH: ./publish/diagnyx
          DIAGNYX_CONFIG: /tmp/dx028-dotnet.json
        run: |
          mkdir -p /tmp/dx028
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx028/dotnet.log"}}}' \
            > /tmp/dx028-dotnet.json
          dotnet run --project packages/dotnet/tests/TraceContextSmokeTest/TraceContextSmokeTest.csproj
          grep '"message":"explicit trace context"' /tmp/dx028/dotnet.log \
            | jq -e '.traceId == "4bf92f3577b34da6a3ce929d0e0e4736" and .spanId == "00f067aa0ba902b7"'
          grep '"message":"ambient activity trace context"' /tmp/dx028/dotnet.log \
            | jq -e '(.traceId | test("^[0-9a-f]{32}$")) and (.spanId | test("^[0-9a-f]{16}$"))'

      - name: DX-017 - NuGet package bundles the platform-specific binary
        run: |
          mkdir -p packages/dotnet/runtimes/win-x64/native
          mkdir -p packages/dotnet/runtimes/linux-x64/native
          mkdir -p packages/dotnet/runtimes/osx-arm64/native
          echo fake-win   > packages/dotnet/runtimes/win-x64/native/diagnyx.bin
          echo fake-linux > packages/dotnet/runtimes/linux-x64/native/diagnyx.bin
          echo fake-osx   > packages/dotnet/runtimes/osx-arm64/native/diagnyx.bin
          dotnet pack packages/dotnet/Diagnyx.Client.csproj -c Release -o /tmp/nupkg-dx017
          unzip -l /tmp/nupkg-dx017/diagnyx-dotnet.*.nupkg > /tmp/dx017_listing.txt
          grep -q 'runtimes/win-x64/native/diagnyx.bin'   /tmp/dx017_listing.txt
          grep -q 'runtimes/linux-x64/native/diagnyx.bin' /tmp/dx017_listing.txt
          grep -q 'runtimes/osx-arm64/native/diagnyx.bin' /tmp/dx017_listing.txt
          ! grep -q 'runtimes/runtimes' /tmp/dx017_listing.txt
          rm -rf packages/dotnet/runtimes

      - name: DX-017 - .NET SDK resolves and invokes the bundled binary
        run: |
          rm -rf /tmp/dx017-smoketest-out
          dotnet build packages/dotnet/tests/SmokeTest/SmokeTest.csproj -c Release -o /tmp/dx017-smoketest-out
          mkdir -p /tmp/dx017-smoketest-out/runtimes/linux-x64/native
          cat > /tmp/dx017-smoketest-out/runtimes/linux-x64/native/diagnyx.bin <<'SCRIPT'
          #!/bin/bash
          echo "DX017_BUNDLED_BINARY_INVOKED"
          exit 0
          SCRIPT
          chmod +x /tmp/dx017-smoketest-out/runtimes/linux-x64/native/diagnyx.bin
          env -u DIAGNYX_PATH dotnet /tmp/dx017-smoketest-out/SmokeTest.dll \
            > /tmp/dx017_bundled_out.txt
          grep -q "DX017_BUNDLED_BINARY_INVOKED" /tmp/dx017_bundled_out.txt

      - name: DX-019 - .NET SDK fails gracefully when the binary cannot be resolved
        run: |
          code=0
          env -u DIAGNYX_PATH \
            dotnet run --project packages/dotnet/tests/SmokeTest/SmokeTest.csproj \
            2>/tmp/dx019_missing_err.txt || code=$?
          test "$code" -eq 1
          grep -qi "diagnyx: warning: diagnyx binary not found" /tmp/dx019_missing_err.txt
          ! grep -qi "unhandled exception" /tmp/dx019_missing_err.txt

      - name: DX-019 - .NET SDK fails gracefully when the binary fails to start
        env:
          DIAGNYX_PATH: /tmp/does-not-exist/diagnyx
        run: |
          code=0
          dotnet run --project packages/dotnet/tests/SmokeTest/SmokeTest.csproj \
            2>/tmp/dx019_start_err.txt || code=$?
          test "$code" -eq 1
          grep -qi "diagnyx: warning: failed to invoke diagnyx cli" /tmp/dx019_start_err.txt
          ! grep -qi "unhandled exception" /tmp/dx019_start_err.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── DX-029: OTel Logs Data Model mapping verification ────────────────────

      - name: DX-029 - OTel mapping script passes and matches the checked-in sample export
        run: |
          node scripts/verify-otel-mapping.js < /dev/null > /tmp/dx029_output.json
          diff /tmp/dx029_output.json docs/examples/otlp-log-export.json

      # ── DX-020/021/022: Node.js SDK package ──────────────────────────────────

      - name: DX-022 - Node.js SDK syntax check (zero dependencies, no install needed)
        run: node --check packages/node/index.js

      - name: DX-022 - Node.js SDK smoke test via CLI binary
        env:
          DIAGNYX_PATH: ./publish/diagnyx
          DIAGNYX_CONFIG: /tmp/dx022.json
        run: |
          mkdir -p /tmp/dx022
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx022/sdk.log"}}}' \
            > /tmp/dx022.json
          node packages/node/tests/smoke.js
          test -f /tmp/dx022/sdk.log
          grep -q '"level":"info"'              /tmp/dx022/sdk.log
          grep -q '"source":"sdk-test-node"'    /tmp/dx022/sdk.log
          grep -q '"message":"node SDK smoke test"' /tmp/dx022/sdk.log

      - name: DX-028 - Node.js SDK accepts explicit and ambient (withTraceContext) trace context
        env:
          DIAGNYX_PATH: ./publish/diagnyx
          DIAGNYX_CONFIG: /tmp/dx028-node.json
        run: |
          mkdir -p /tmp/dx028
          printf '{"sink":{"type":"file","file":{"path":"/tmp/dx028/node.log"}}}' \
            > /tmp/dx028-node.json
          node packages/node/tests/trace-context-smoke.js
          grep '"message":"explicit trace context"' /tmp/dx028/node.log \
            | jq -e '.traceId == "4bf92f3577b34da6a3ce929d0e0e4736" and .spanId == "00f067aa0ba902b7"'
          grep '"message":"ambient trace context after await"' /tmp/dx028/node.log \
            | jq -e '.traceId == "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" and .spanId == "bbbbbbbbbbbbbbbb"'

      - name: DX-022 - Node.js SDK fails gracefully when the binary cannot be resolved
        run: |
          code=0
          env -u DIAGNYX_PATH node -e '
            const { DiagnyxLogger } = require("./packages/node");
            process.exit(new DiagnyxLogger("ci").info("hello"));
          ' 2>/tmp/dx022_missing_err.txt || code=$?
          test "$code" -eq 1
          grep -qi "diagnyx: warning: diagnyx binary not found" /tmp/dx022_missing_err.txt
          ! grep -qi "throw\|uncaught" /tmp/dx022_missing_err.txt

      - name: DX-022 - Node.js SDK fails gracefully when the binary fails to start
        env:
          DIAGNYX_PATH: /tmp/does-not-exist/diagnyx
        run: |
          code=0
          node -e '
            const { DiagnyxLogger } = require("./packages/node");
            process.exit(new DiagnyxLogger("ci").info("hello"));
          ' 2>/tmp/dx022_start_err.txt || code=$?
          test "$code" -eq 1
          grep -qi "diagnyx: warning: failed to invoke diagnyx cli" /tmp/dx022_start_err.txt
          ! grep -qi "throw\|uncaught" /tmp/dx022_start_err.txt

      - name: DX-020 - postinstall never fails npm install
        working-directory: packages/node
        run: |
          rm -rf bin
          code=0
          node scripts/postinstall.js 2>/tmp/dx020_postinstall.txt || code=$?
          test "$code" -eq 0
          cat /tmp/dx020_postinstall.txt
          rm -rf bin

      - name: DX-020 - DiagnyxLogger resolves the bundled binary
        run: |
          mkdir -p packages/node/bin
          cat > packages/node/bin/diagnyx <<'SCRIPT'
          #!/bin/bash
          echo "DX020_BUNDLED_BINARY_INVOKED"
          exit 0
          SCRIPT
          chmod +x packages/node/bin/diagnyx
          env -u DIAGNYX_PATH node -e '
            const { DiagnyxLogger } = require("./packages/node");
            process.exit(new DiagnyxLogger("ci").info("hello"));
          ' > /tmp/dx020_bundled_out.txt
          grep -q "DX020_BUNDLED_BINARY_INVOKED" /tmp/dx020_bundled_out.txt
          rm -rf packages/node/bin

      # ── DX-030/DX-031: OTLP sink, configurable via config file only ─────────

      - name: DX-030 - start mock OTLP/HTTP collector
        run: |
          mkdir -p /tmp/dx030
          cat > /tmp/dx030/mock_collector.py <<'PY'
          import http.server

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  with open('/tmp/dx030/received.json', 'wb') as f:
                      f.write(body)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{}')

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(('127.0.0.1', 4318), Handler).serve_forever()
          PY
          nohup python3 /tmp/dx030/mock_collector.py > /tmp/dx030/collector.log 2>&1 &
          echo $! > /tmp/dx030/collector.pid
          for i in $(seq 1 40); do
            curl -sf -o /dev/null -X POST -d '{}' http://127.0.0.1:4318/v1/logs && break
            sleep 0.25
          done

      - name: DX-030 - OTLP sink exports a valid LogRecord
        run: |
          printf '{"sink":{"type":"otlp","otlp":{"endpoint":"http://127.0.0.1:4318"}},"defaults":{"source":"otlp-ci"}}' \
            > /tmp/dx030/diagnyx.config.json
          rm -f /tmp/dx030/received.json
          DIAGNYX_CONFIG=/tmp/dx030/diagnyx.config.json ./publish/diagnyx log \
            --level error --message "otlp ci test" --context '{"k":"v"}'
          test -s /tmp/dx030/received.json
          jq -e '.resourceLogs[0].resource.attributes[] | select(.key=="service.name") | .value.stringValue == "otlp-ci"' /tmp/dx030/received.json
          jq -e '.resourceLogs[0].scopeLogs[0].logRecords[0].severityText == "ERROR"' /tmp/dx030/received.json
          jq -e '.resourceLogs[0].scopeLogs[0].logRecords[0].severityNumber == 17' /tmp/dx030/received.json
          jq -e '.resourceLogs[0].scopeLogs[0].logRecords[0].body.stringValue == "otlp ci test"' /tmp/dx030/received.json
          jq -e '.resourceLogs[0].scopeLogs[0].logRecords[0].attributes[] | select(.key=="k") | .value.stringValue == "v"' /tmp/dx030/received.json

      - name: DX-030 - OTLP sink surfaces collector-unreachable errors and exits 1
        run: |
