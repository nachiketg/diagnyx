name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: diagnyx.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: diagnyx
          - os: macos-14
            rid: osx-arm64
            binary: diagnyx

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish core/Diagnyx.Core.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:Version="$VERSION" \
            -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnyx-${{ matrix.rid }}
          path: publish/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Create GitHub Release and publish packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release binaries
        run: |
          cp artifacts/diagnyx-win-x64/diagnyx.exe   diagnyx-win-x64.exe
          cp artifacts/diagnyx-linux-x64/diagnyx     diagnyx-linux-x64
          cp artifacts/diagnyx-osx-arm64/diagnyx      diagnyx-osx-arm64
          chmod +x diagnyx-linux-x64 diagnyx-osx-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            diagnyx-win-x64.exe
            diagnyx-linux-x64
            diagnyx-osx-arm64

      - name: Pack and publish NuGet package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack packages/dotnet/Diagnyx.Client.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -o nupkg
          dotnet nuget push nupkg/*.nupkg \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish npm package
        working-directory: packages/node
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
